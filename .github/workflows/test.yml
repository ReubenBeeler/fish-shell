name: Test

on: [push, pull_request]

env:
  FISH_TEST_MAX_CONCURRENCY: "4"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, build_tools/update-dependencies.sh
    - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1, build_tools/update-dependencies.sh
      with:
        update: true
        msystem: MSYS
      id: msys2
    - name: Install deps
      # Not using setup-msys2 `install` option to make it easier to copy/paste
      run: |
        pacman --noconfirm -S --needed git rust python3 diffutils tmux
    - name: rebase
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      shell: cmd
      run: |
        "%MSYS2_LOCATION%\usr\bin\dash" /usr/bin/rebaseall -p -v
    - name: check
      env:
        # Matches the first `system_tests` pass in build_tools/check.sh, which is
        # the one that runs command-not-found.fish (it has no `ln`, so the
        # symlink-less pass skips it).
        MSYS: winsymlinks
      run: |
        set -x
        cargo build
        tests/test_driver.py target/debug tests/checks/command-not-found.fish
